name: Quality checks
on:
  pull_request:
    paths:
      - "src/**"
      - "content/**"
      - "scripts/**"
      - "tests/**"
      - "supabase/**"
      - "package*.json"
      - "*config*"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    env:
      LEVELUP_BACKEND: local
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
