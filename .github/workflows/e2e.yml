name: Critical learning flows
on:
  pull_request:
    paths:
      - "src/app/api/**"
      - "src/app/auth/**"
      - "src/lib/**"
      - "content/**"
      - "src/features/**"
      - "src/components/levelup.tsx"
      - "src/components/levelup/auth-view.tsx"
      - "src/components/levelup/exam-view.tsx"
      - "src/components/levelup/report-issue.tsx"
      - "src/components/levelup/submit-view.tsx"
      - "src/components/levelup/result-view.tsx"
      - "src/components/levelup/practice-view.tsx"
      - "src/components/levelup/tryout-view.tsx"
      - "src/components/levelup/types.ts"
      - "src/components/tryout-catalog.tsx"
      - "supabase/**"
      - "tests/e2e/**"
      - "package*.json"
      - "next.config.*"
      - "playwright.config.*"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical-e2e:
    env:
      LEVELUP_BACKEND: local
      LEVELUP_E2E_PRODUCTION: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/learning.spec.ts
      - run: NEXT_PUBLIC_LEVELUP_PILOT_MODE=1 npm run build
      - run: NEXT_PUBLIC_LEVELUP_PILOT_MODE=1 npm run test:e2e -- tests/e2e/pilot.spec.ts
