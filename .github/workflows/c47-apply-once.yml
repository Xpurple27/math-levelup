name: C4.7 apply staged hardening once
on:
  push:
    branches:
      - c4.7-content-studio-hardening
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c4.7-content-studio-hardening
      - name: Fetch verified patch
        run: |
          curl --fail --silent --show-error --location \
            https://sb-itdi14aixkyj.vercel.run/c47.patch \
            --output /tmp/c47.patch
          echo "64143d1cdd557bc35467491a731e4e0e1c9b908c6b98f916eb290451d3ba85db  /tmp/c47.patch" | sha256sum --check
      - name: Apply C4.7 changes
        run: |
          git apply --check /tmp/c47.patch
          git apply /tmp/c47.patch
          rm -f vercel.json .github/workflows/c47-apply-once.yml
      - name: Commit C4.7 as one implementation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(content): harden content studio and multi-format authoring"
          git push origin HEAD:c4.7-content-studio-hardening
